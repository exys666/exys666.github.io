name: Build and Publish
on:
  push:
    branches: [ master ]
jobs:
  build-and-publish :
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Publish 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: public 
          folder: _site
